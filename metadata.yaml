help: |
  SMM2 Level/Player Query - Super Mario Maker 2 Data Tool

  Commands:
  /smm2 <level or player ID> - Query level info (with thumbnail) or player info
  /rest 0-4 - Random level draw + bcd download (0=any/1=easy/2=normal/3=hard/4=extreme)
  /bcd <level ID> - Download bcd file for a specific level
  /render <level ID> - Render HD level images (overworld + underworld)

  Notes:
  ID supports dashed (XXX-XXX-XXX) or 9-char format, case-insensitive
  /smm2 queries levels first, auto-falls back to player if not found
  /render requires toost renderer; it auto-downloads on first use
  toost download: https://github.com/TheGreatRambler/toost/releases
